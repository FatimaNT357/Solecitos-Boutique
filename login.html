<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solecitos Boutique | Acceso</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-body">
  <header class="simple-header"><a class="mini-logo" href="index.html">☼ <span>SOLECITOS <small>Boutique</small></span></a><a class="text-link" href="index.html">← Volver al inicio</a></header>
  <main class="login-layout">
    <section class="login-decoration">
      <div class="decoration-sun">☼</div>
      <p class="eyebrow">BIENVENIDA A</p>
      <h1>SOLECITOS<br><small>Boutique</small></h1>
      <p>Tu estilo, en cada detalle.</p>
      <div class="ribbon ribbon-one"></div><div class="ribbon ribbon-two"></div>
    </section>
    <section class="login-panel">
      <div class="user-icon">♙</div>
      <h2>Iniciar sesión</h2>
      <p class="muted">Ingresa tus datos para continuar</p>
      <form action="#" method="get">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Escribe tu contraseña" required>
        <div class="form-row"><label class="check-label"><input type="checkbox"> Recordarme</label><a href="#ayuda">¿Olvidaste tu contraseña?</a></div>
        <button class="button full-button" type="submit">Entrar</button>
      </form>
      <p class="login-note" id="ayuda">Esta pantalla es una maqueta visual; no valida usuarios ni guarda datos.</p>
    </section>
  </main>
  <footer class="footer"><span>☼ SOLECITOS BOUTIQUE</span><span>Acceso general</span></footer>
</body>
</html>
